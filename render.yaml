# Render Blueprint — OctoLearn backend (API + admin panel) + PostgreSQL.
# Guide: docs/deploy-render.md
services:
  - type: web
    name: octolearn-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # devDependencies (typescript, tsx) are needed to build, even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: octolearn-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: APP_TIMEZONE
        value: Asia/Ulaanbaatar

databases:
  - name: octolearn-db
    plan: free
    region: singapore
    databaseName: octolearn
    user: octolearn
